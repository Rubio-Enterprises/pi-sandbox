# Rendered by rubio-standards; `copier update` keeps it current and merges your additions.
# Source: Rubio-Enterprises/standards, template/.mise.toml.jinja
# Shared pins and tasks come from the gitignored full-history .standards-config/.
# Trusted provisioners supply STANDARDS_PIN before setup; native laptops follow main.
# Only a fully absent checkout uses a local no-op; partial parents fail locally.
#
# First on a native laptop: mise bootstrap --only repos,tools --yes
# Provisioned environments validate the pin and run repos status before setup.
# Repository tasks, [env] and extra tools go below. Task definitions replace
# shared tasks; namespaced tasks join the shared composites.
min_version = "2026.10.19"
include = [
  "{%- if env.STANDARDS_PIN is defined and not env.STANDARDS_PIN is matching(pat='^[0-9a-f]{40}$') -%}    {{ throw(message='standards pin: expected a non-empty 40-character lowercase SHA') }}  {%- endif -%}  {%- if (config_root ~ '/.standards-config') is exists -%}    {%- for path in [      'config/tombi.toml',      'config/lefthook/base.yml',      'config/lefthook/py.yml',      'config/lefthook/py-pyright.yml',      'config/mise/base.toml',      'config/mise/python.toml',      'config/tasks/base.toml',      'config/tasks/python.toml'    ] -%}      {%- if not (config_root ~ '/.standards-config/' ~ path) is file -%}        {{ throw(message='shared config incomplete: missing ' ~ path ~ '; restore the missing parent or move .standards-config aside, then run mise bootstrap --only repos,tools') }}      {%- endif -%}    {%- endfor -%}  {%- endif -%}.config/mise-bootstrap.toml",
  "{% if (config_root ~ '/.standards-config') is exists %}.standards-config/config/mise/base.toml{% else %}.config/mise-bootstrap.toml{% endif %}",
  "{% if (config_root ~ '/.standards-config') is exists %}.standards-config/config/mise/python.toml{% else %}.config/mise-bootstrap.toml{% endif %}",
]

[tools]
# Language runtimes are this repository's pins. Lint and format tools come
# from the shared includes above; a tool named here overrides its shared pin.
node = "24.21.0"
python = "3.14.6"

# The shared pins follow main, so this repository commits no
# mise.lock (lint-config rejects one): a lockfile would pin them per
# repository again, one PR each. Leave `settings.lockfile` unset: `false`
# makes a globally locked mise refuse to install, and `true` writes a lock.

[bootstrap.repos]
".standards-config" = { url = "https://github.com/Rubio-Enterprises/standards.git", ref = "{{ env.STANDARDS_PIN | default(value='main') }}" }

[bootstrap.hooks]
post-repos = "mise bootstrap repos status --missing"

# Git hooks are per-repo via lefthook. Local `mise install` activates them;
# CI never fires Git hooks, and lint-hooks runs Lefthook itself.
[hooks]
enter = 'test -f .standards-config/config/mise/base.toml || echo "shared config missing: run mise bootstrap --only repos,tools" >&2'
postinstall = 'test -n "${CI:-}" || mise exec -- lefthook install'

[task_config]
includes = [
  ".standards-config/config/tasks/base.toml",
  ".standards-config/config/tasks/python.toml",
]
