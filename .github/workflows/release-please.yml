# @generated by rubio-standards. DO NOT EDIT: `copier update` replaces this whole file.
# Source: Rubio-Enterprises/standards, template/.github/workflows/release-please.yml.jinja
# To change this, open a PR against the template; there is no per-repo override.
# release-please: opens / updates a release PR on every push to main.
# When the release PR is merged, release-please tags + creates a GitHub release.
# Per-stack release-types are configured in release-please-config.json.

name: release-please
# `on:` is quoted to satisfy `yaml[truthy]` (yamllint + ansible-lint): without
# quotes, YAML 1.1 parsers fold `on` into the boolean `On`. GitHub Actions
# resolves the key by name regardless, and actionlint accepts both forms.
"on":
  push:
    branches: [main]

permissions:
  contents: write # tag + create release
  pull-requests: write # open / update the release PR

jobs:
  # The 120-minute org-wide floor bounds execution on a wedged self-hosted runner
  # (mac-dev-playbook#917); it never bounds queue time. The measured org-wide
  # maximum executing job is 47 minutes. A tighter per-class value, where
  # present, is deliberate and must remain unchanged.
  release-please:
    runs-on: ${{ fromJSON(vars.RUNNERS || '{}').small || fromJSON('["ubuntu-slim"]') }}
    timeout-minutes: 120
    steps:
      - name: Mint release-please App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          # Use a GitHub App token, not GITHUB_TOKEN, so release PR workflows
          # run immediately instead of waiting for manual "Approve workflows".
          token: ${{ steps.app-token.outputs.token }}
          # Defaults to release-please-config.json + .release-please-manifest.json
          # at the repo root — both are Copier-synced into every consumer repo.
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # Every step below used to be gated on `prs_created`, which is true only
      # on the run that opened or updated the release PR. That made each of
      # them a one-shot: one transient failure stranded the release PR for
      # good, because release-please reports `prs_created: false` for a PR
      # that already exists, so a re-run skipped the repair instead of doing
      # it (ws run 35345211300 — a flaky mise download skipped the lock
      # refresh, then `lint-hooks` failed on the stale lock and no later run
      # could fix it). Resolving the release PR from the repository instead
      # makes a re-run — or simply the next push to main —
      # repair whatever the failed run left undone.
      - name: Resolve the release PR
        id: release-pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          # Raw output, never `fromJSON`: GitHub Actions expands `env:` eagerly
          # even for if-skipped steps (aw-gateway run 32876379705). This step
          # carries no `if:` at all, but the rule holds for the value's shape —
          # release-please can report `prs_created: true` while leaving `prs`
          # empty, right after it closes a merged release PR (aw-gateway run
          # 32880453268), so the parse must tolerate an empty string.
          RELEASE_PRS: ${{ steps.release.outputs.prs }}
        run: |
          set -euo pipefail
          prs=${RELEASE_PRS:-}
          [ -n "$prs" ] || prs='[]'
          branch=$(jq -r 'first.headBranchName // empty' <<<"$prs")
          number=$(jq -r 'first.number // empty' <<<"$prs")
          if [ -z "$branch" ] || [ -z "$number" ]; then
            # `autorelease: pending` is release-please's own label for an open,
            # unreleased release PR. One package per repo across the org set,
            # matching the `first`/`[0]` read; a monorepo config would need the
            # component here.
            open_pr=$(gh pr list --repo "$REPO" --state open \
              --label 'autorelease: pending' --limit 1 \
              --json number,headRefName)
            branch=$(jq -r 'first.headRefName // empty' <<<"$open_pr")
            number=$(jq -r 'first.number // empty' <<<"$open_pr")
          fi
          if [ -z "$branch" ] || [ -z "$number" ]; then
            # No release PR is open: this push released one, or carried nothing
            # releasable. Both are ordinary, so report empty and let the steps
            # below skip rather than failing the run.
            echo 'no open release PR; nothing to refresh or arm'
            branch=''
            number=''
          fi
          {
            echo "branch=$branch"
            echo "number=$number"
          } >>"$GITHUB_OUTPUT"

      - name: Check out release PR
        if: steps.release-pr.outputs.branch != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ steps.release-pr.outputs.branch }}
      # ADR-0033: the refresh needs only uv. Any mise
      # command here would load the root .mise.toml, whose includes resolve
      # from the private standards repository before a bootstrap, so install
      # uv directly at the shared pin (config/mise/base.toml) that writes and
      # checks this lockfile everywhere else.
      - name: Set up uv
        if: steps.release-pr.outputs.branch != ''
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.15"
      - name: Refresh Python release lockfile
        if: steps.release-pr.outputs.branch != ''
        env:
          RELEASE_BRANCH: ${{ steps.release-pr.outputs.branch }}
        run: |
          set -euo pipefail
          # The `if:` above already proved this non-empty; re-check anyway,
          # because an empty value here means the checkout landed on the
          # triggering commit instead, where the lock is already consistent —
          # so the refresh would no-op and ship a stale lock (v0.1.10 of
          # aw-gateway shipped exactly that). It MUST fail loudly instead.
          if [ -z "${RELEASE_BRANCH:-}" ]; then
            echo "::error::could not resolve the release PR branch from the release-please prs output"
            exit 1
          fi
          uv lock
          if git diff --quiet -- uv.lock; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "chore: refresh uv lock"
          git push origin "HEAD:$RELEASE_BRANCH"

      - name: Enable auto-merge on the release PR
        # GitHub-native auto-merge waits on *required* status checks only —
        # it will land over a red check that isn't required (the same hazard
        # docs/runbooks/converge-org-set.md warns about, and why ADR-0021
        # rejected this pattern for the plugin carrier controller). It's safe
        # here, and ONLY here, because this repo's required-check set is the
        # full property-driven gate floor (gate_tests, gate_lint_config,
        # gate_audit, gate_secret_scan, gate_pr_conventions — see
        # docs/runbooks/create-repo.md): there is no meaningful non-required
        # check left for auto-merge to skip past. A repo that doesn't carry
        # that complete gate-property set is not a safe candidate for this.
        #
        # Blast radius: every uses_release_please consumer (repo_type native
        # or marketplace, plus explicit extended-fork opt-ins) renders this step, not
        # just the smaller migration wave that raised it (dotfiles#322).
        #
        # No repo-settings change needed: auto-merge-allowed is already enabled
        # across the org set at repo creation (docs/runbooks/create-repo.md).
        #
        # Merge method is read per repository, not assumed, mirroring
        # _merge_method_flag in org_plugin_carrier_pull_requests.py: this
        # file also renders for explicit fork opt-ins and marketplace repos whose type is
        # extended_fork — a shared-history Sync Target, which org policy
        # makes merge-only so upstream parentage survives. Assuming squash
        # there is a hard 405.
        #
        # Runs whenever a release PR is open, not only on the run that opened
        # it: arming is idempotent, and a run that died before reaching this
        # step left the PR unarmed with nothing to re-arm it. A push with no
        # open release PR resolves empty and skips.
        #
        # Order matters for the Python refresh above: a failed refresh fails
        # the job before this step, so a release PR whose lock could not be
        # refreshed is never armed.
        if: steps.release-pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ steps.release-pr.outputs.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          merge_settings=$(gh repo view "$REPO" --json squashMergeAllowed,mergeCommitAllowed)
          if [ "$(echo "$merge_settings" | jq -r '.squashMergeAllowed')" = "true" ]; then
            merge_flag=--squash
          elif [ "$(echo "$merge_settings" | jq -r '.mergeCommitAllowed')" = "true" ]; then
            merge_flag=--merge
          else
            echo "::error::$REPO allows neither squash nor merge commits; can't auto-merge PR #$PR_NUMBER" >&2
            exit 1
          fi
          gh pr merge "$PR_NUMBER" --repo "$REPO" "$merge_flag" --auto
